<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form - school registration form</title>
    <style>
        body {
            background-color: #f5f2eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1b3022;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .form-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #d5ded7;
        }

        .form-header {
            margin-bottom: 25px;
            border-bottom: 2px solid #1b3022;
            padding-bottom: 10px;
        }

        .form-header h2 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
            color: #1b3022;
        }

        .form-header p {
            margin: 5px 0 0 0;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #4a6b53;
        }

        .section-box {
            background-color: #e5eee7;
            padding: 15px 20px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .form-group label {
            flex: 0 0 150px;
            font-size: 13px;
            font-weight: 600;
            color: #2c4a35;
        }

        .form-group .colon {
            flex: 0 0 20px;
            text-align: center;
            font-weight: bold;
        }

        .form-group .input-wrapper {
            flex: 1;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #b8c7bc;
            border-radius: 4px;
            background-color: #ffffff;
            font-size: 13px;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4a6b53;
        }

        .date-inputs {
            display: flex;
            gap: 10px;
        }

        .date-inputs input {
            text-align: center;
        }

        .inline-fields {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .inline-fields .form-group {
            margin-bottom: 0;
            flex: 1;
        }

        .checkbox-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 13px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            cursor: pointer;
        }

        .question-list {
            font-size: 13px;
            margin: 0 0 15px 0;
            padding-left: 15px;
            line-height: 1.6;
        }

        .question-list li {
            margin-bottom: 8px;
        }

        .footer-signature {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 15px;
            font-size: 12px;
            color: #4a6b53;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .signature-line {
            border-bottom: 1px solid #060a07;
            width: 150px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <!-- Header -->
        <div class="form-header">
            <h2>SIGN UP FORM</h2>
            <p>Culinary Festival</p>
        </div>

        <form>
            <!-- Personal Information Section -->
            <div class="section-box">
                <div class="form-group">
                    <label>Full Name</label>
                    <span class="colon">:</span>
                    <div class="input-wrapper"><input type="text"></div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <span class="colon">:</span>
                    <div class="input-wrapper"><input type="email"></div>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <span class="colon">:</span>
                    <div class="input-wrapper"><input type="tel" style="width: 60%;"></div>
                </div>
                <div class="form-group">
                    <label>Date of Birth</label>
                    <span class="colon">:</span>
                    <div class="input-wrapper date-inputs">
                        <input type="text" placeholder="DD" maxlength="2" style="width: 50px;"> /
                        <input type="text" placeholder="MM" maxlength="2" style="width: 50px;"> /
                        <input type="text" placeholder="YYYY" maxlength="4" style="width: 70px;">
                    </div>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <span class="colon">:</span>
                    <div class="input-wrapper"><input type="text"></div>
                </div>
                <div class="form-group">
                    <label>City</label>
                    <span class="colon">:</span>
                    <div class="input-wrapper"><input type="text" style="width: 60%;"></div>
                </div>
                <div class="form-group">
                    <label>ZIP/Postal Code</label>
                    <span class="colon">:</span>
                    <div class="input-wrapper"><input type="text" style="width: 60%;"></div>
                </div>
                <div class="form-group">
                    <label>State/Province</label>
                    <span class="colon">:</span>
                    <div class="input-wrapper"><input type="text"></div>
                </div>
                <div class="form-group">
                    <label>Country</label>
                    <span class="colon">:</span>
                    <div class="input-wrapper"><input type="text"></div>
                </div>
            </div>

            <!-- Ticket Details Section -->
            <div class="section-box">
                <div class="form-group">
                    <label>Ticket Type</label>
                    <span class="colon">:</span>
                    <div class="input-wrapper checkbox-group">
                        <label><input type="checkbox"> General</label>
                        <label><input type="checkbox"> Family</label>
                        <label><input type="checkbox"> Student</label>
                        <label><input type="checkbox"> VIP</label>
                    </div>
                </div>
                <div class="inline-fields">
                    <div class="form-group">
                        <label>Number of Tickets</label>
                        <span class="colon">:</span>
                        <div class="input-wrapper"><input type="text" style="width: 80px;"></div>
                    </div>
                    <div class="form-group">
                        <label>Payment Method</label>
                        <span class="colon">:</span>
                        <div class="input-wrapper"><input type="text"></div>
                    </div>
                </div>
            </div>

            <!-- Activities Section -->
            <div class="section-box">
                <div class="checkbox-group">
                    <label><input type="checkbox"> Cooking Demos</label>
                    <label><input type="checkbox"> Workshops</label>
                    <label><input type="checkbox"> Tasting Sessions</label>
                </div>
            </div>

            <div class="section-box">
                <div class="checkbox-group">
                    <label><input type="checkbox"> Morning</label>
                    <label><input type="checkbox"> Afternoon</label>
                    <label><input type="checkbox"> Evening</label>
                </div>
            </div>

            <!-- Questions Section -->
            <div class="section-box">
                <ul class="question-list">
                    <li>Are you a culinary professional? &nbsp;&nbsp; [ &nbsp; ] Yes &nbsp;&nbsp; [ &nbsp; ] No</li>
                    <li>How would you rate your cooking skills? (Beginner, Intermediate, Advanced)</li>
                    <li>
                        Any specific cuisines or dishes you're interested in learning about?
                        <div style="margin-top: 8px;"><input type="text"></div>
                    </li>
                </ul>

                <div class="footer-signature">
                    <div>Date: <span class="signature-line" style="width: 100px;"></span></div>
                    <div>Signature: <span class="signature-line"></span></div>
                </div>
            </div>
        </form>
    </div>

</body>
</html>
