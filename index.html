<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Pendaftaran</title>

    <style>
        body {
            font-family: "Times New Roman", serif;

        h2 {
            font-size: 24px;

        fieldset {

        }

        input {

            padding: 3px;
        }

        .username {
            width: 225px;
        }

        .password {
            width: 220px;
        }

        .tanggal {
            width: 145px;
        }

        .usia {
            width: 225px;
        }

        .email {
            width: 220px;
        }
    </style>
</head>

<body>

    <h2>Form Pendaftaran</h2>

    <fieldset>

        <label>User name</label>

               value="BBPVP Bekasi">

        <label>Password</label>

               value="12345678">
        <br>

        <label>Tanggal Lahir</label>
        <input type="date" class="tanggal"
               value="2026-11-10">
        <br>

        <label>Usia</label>
        <input type="number" class="usia"
               value="26">
        <br>

        <label>Email</label>
        <input type="email" class="email"
               value="farhanahadi87@gmail.com">

</body>
</html>
